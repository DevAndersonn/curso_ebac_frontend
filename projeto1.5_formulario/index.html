<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="box">
        <div class="container">
            <div class="containerBx">
                <h1>Formulário Inteligente</h1>
                <p class="p1">Garanta que B é Maior que A!</p>
                <h2>B &gt; A?</h2>
                <form id="all">
                    <input type="number" id="numeroA" placeholder="Valor A" required>
                    <input type="number" id="numeroB" placeholder="Valor B" required>
                    <button type="submit">Calcular</button>
                </form>
                <p class="p2" id="resultado"></p>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
